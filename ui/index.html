<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>InvoiceRail — read and settle invoices</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, -apple-system, "Noto Sans", sans-serif; background:#0f1115; color:#e7e9ee;
         margin:0; padding:32px; line-height:1.55; }
  h1 { font-size:22px; margin:0 0 4px; color:#7ee787; }
  .sub { color:#9aa4b2; margin-bottom:24px; font-size:14px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  label { display:block; font-size:12px; color:#9aa4b2; margin-bottom:4px; }
  input { background:#0d1117; border:1px solid #2a2f3a; color:#e7e9ee; border-radius:6px; padding:8px 10px;
          font-family:ui-monospace, monospace; font-size:13px; min-width:260px; }
  button { background:#238636; color:#fff; border:0; border-radius:6px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.alt { background:#1f6feb; }
  button.warn { background:#9e6a03; }
  button:disabled { background:#30363d; color:#8b949e; cursor:not-allowed; }
  table { border-collapse:collapse; margin-top:16px; width:100%; max-width:820px; }
  td, th { text-align:left; padding:8px 10px; border-bottom:1px solid #21262d; font-size:14px; }
  th { color:#9aa4b2; font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .ok { color:#7ee787; } .bad { color:#ff7b72; } .warnc { color:#d29922; }
  code { background:#0d1117; border:1px solid #2a2f3a; border-radius:4px; padding:1px 5px; }
  .note { color:#8b949e; font-size:13px; margin-top:18px; max-width:820px; }
</style>
</head>
<body>
<h1>InvoiceRail</h1>
<div class="sub">Read an invoice, settle it in parts, withdraw or cancel. Nothing here holds your keys:
every write goes through the wallet in your browser.</div>

<div class="row">
  <div><label>RPC</label><input id="rpc" value="https://rpc-test.qday.info"></div>
  <div><label>InvoiceRail contract</label><input id="addr" placeholder="0x..." value=""></div>
</div>
<div class="row">
  <div><label>Invoice id (text, hashed to bytes32)</label><input id="inv" value="inv-1"></div>
  <button id="load">Load</button>
  <button id="connect" class="alt">Connect wallet</button>
</div>

<table id="out" hidden>
  <tr><th>field</th><th>value</th></tr>
</table>

<div class="row" id="actions" hidden style="margin-top:18px">
  <div><label>Pay amount (token units)</label><input id="amount" placeholder="100"></div>
  <button id="pay">Pay</button>
  <button id="withdraw" class="alt">Withdraw</button>
  <button id="cancel" class="warn">Cancel (after due)</button>
</div>

<div class="note" id="status"></div>

<script src="ethers.umd.min.js"></script>
<script>
const ABI = [
  "function invoices(bytes32) view returns (address merchant, uint128 amount, uint128 paid, uint64 dueAt, bool settled, bool cancelled)",
  "function remaining(bytes32) view returns (uint256)",
  "function token() view returns (address)",
  "function pay(bytes32 id, uint128 amount)",
  "function withdraw(bytes32 id)",
  "function cancel(bytes32 id)",
  "function balanceOf(address) view returns (uint256)"
];
const ERC20 = ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)",
               "function approve(address,uint256) returns (bool)", "function allowance(address,address) view returns (uint256)"];
const $ = (id) => document.getElementById(id);
let provider, signer, account;

function setStatus(msg, cls) { $("status").innerHTML = cls ? `<span class="${cls}">${msg}</span>` : msg; }

async function connect() {
  if (!window.ethereum) { setStatus("No injected wallet found. Read-only mode still works.", "bad"); return; }
  await window.ethereum.request({ method: "eth_requestAccounts" });
  provider = new ethers.BrowserProvider(window.ethereum);
  signer = await provider.getSigner();
  account = await signer.getAddress();
  setStatus("connected: " + account, "ok");
}

function readProvider() { return new ethers.JsonRpcProvider($("rpc").value.trim()); }

async function load() {
  const rp = readProvider();
  const c = new ethers.Contract($("addr").value.trim(), ABI, rp);
  const id = ethers.id($("inv").value.trim());
  try {
    const inv = await c.invoices(id);
    const remaining = await c.remaining(id);
    const tokenAddr = await c.token();
    const token = new ethers.Contract(tokenAddr, ERC20, rp);
    const dec = await token.decimals();
    const fmt = (v) => ethers.formatUnits(v, dec);
    const rows = [
      ["id (bytes32)", id],
      ["merchant", inv.merchant],
      ["amount", fmt(inv.amount)],
      ["paid", fmt(inv.paid)],
      ["remaining", fmt(remaining)],
      ["dueAt", new Date(Number(inv.dueAt) * 1000).toISOString()],
      ["settled", inv.settled ? "yes" : "no"],
      ["cancelled", inv.cancelled ? "yes" : "no"],
      ["token", tokenAddr]
    ];
    $("out").innerHTML = "<tr><th>field</th><th>value</th></tr>" +
      rows.map(([k, v]) => `<tr><td>${k}</td><td><code>${v}</code></td></tr>`).join("");
    $("out").hidden = false;
    $("actions").hidden = false;
    setStatus("loaded invoice " + $("inv").value, "ok");
  } catch (e) {
    setStatus("read failed: " + (e.shortMessage || e.message), "bad");
  }
}

async function withSigner(fn) {
  if (!signer) { setStatus("connect a wallet first", "bad"); return; }
  try { await fn(); } catch (e) { setStatus("failed: " + (e.shortMessage || e.message), "bad"); }
}

$("connect").onclick = () => connect().catch(e => setStatus(String(e), "bad"));
$("load").onclick = () => load();
$("pay").onclick = () => withSigner(async () => {
  const c = new ethers.Contract($("addr").value.trim(), ABI, signer);
  const tokenAddr = await c.token();
  const token = new ethers.Contract(tokenAddr, ERC20, signer);
  const dec = await token.decimals();
  const amount = ethers.parseUnits($("amount").value.trim(), dec);
  const id = ethers.id($("inv").value.trim());
  const allowance = await token.allowance(account, $("addr").value.trim());
  if (allowance < amount) {
    setStatus("approving…");
    await (await token.approve($("addr").value.trim(), amount)).wait();
  }
  setStatus("paying…");
  await (await c.pay(id, amount)).wait();
  setStatus("paid", "ok");
  await load();
});
$("withdraw").onclick = () => withSigner(async () => {
  const c = new ethers.Contract($("addr").value.trim(), ABI, signer);
  await (await c.withdraw(ethers.id($("inv").value.trim()))).wait();
  setStatus("withdrawn", "ok");
  await load();
});
$("cancel").onclick = () => withSigner(async () => {
  const c = new ethers.Contract($("addr").value.trim(), ABI, signer);
  await (await c.cancel(ethers.id($("inv").value.trim()))).wait();
  setStatus("cancelled", "ok");
  await load();
});
</script>
</body>
</html>
